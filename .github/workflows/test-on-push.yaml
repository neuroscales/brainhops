name: Test on push
description: Test on push

on:
  push:
    branches:
      - master
      - main
    paths:
      - src/**
      - tests/**
      - setup.py
      - pyproject.toml
      - .github/workflows/test*.yaml
  pull_request:
    paths:
      - src/**
      - tests/**
      - setup.py
      - pyproject.toml
      - .github/workflows/test*.yaml

jobs:
  tests:
    uses: ./.github/workflows/test-matrix.yaml
