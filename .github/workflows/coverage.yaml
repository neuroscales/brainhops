name: Run coverage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      # Python >= 3.12 is needed for the sys.monitoring tracer below
      - name: Setup Python ${{ inputs.python-version || '3.12' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run pytest with coverage
        shell: bash
        # sys.monitoring makes tracing (almost) free, where the default
        # tracer doubles the test time. It falls back to the default
        # tracer on Python < 3.12.
        env:
          COVERAGE_CORE: sysmon
        run: pytest --cov=brainhops --cov-report=term --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
