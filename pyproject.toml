[project]
name = "brainhops"
authors = [{name = "Balbastre, Yael", email = "y.balbastre@ucl.ac.uk"}]
description = "Scalable spatial transforms"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["typing_extensions", "numpy", "scipy"]
dynamic = ["version"]

[project.optional-dependencies]

# backends
dask = ["dask[array]", "dask-image"]
cupy = ["cupy"]
backends = ["brainhops[dask]", "brainhops[cupy]"]

# io
itk = ["h5py"]
spm = ["nibabel"]
nibabel = ["nibabel"]
io = ["brainhops[itk]", "brainhops[spm]", "brainhops[nibabel]"]

# test
test = [
    "pytest",
    "h5py",
    "simpleitk",
    "pytest-cov",
    "nibabel",
]

# doc
doc = [
  "zensical>=0.0.11",
  "mkdocstrings[python]>=1.0.0",
  "markdown-grid-tables",
]


[project.urls]
Homepage = "https://github.com/neuroscales/brainhops"
Issues = "https://github.com/neuroscales/brainhops/issues"

[build-system]
requires = [
    "setuptools>=59",
    "wheel",
    "versioningit>=1.0",
]
build-backend = "setuptools.build_meta"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/brainhops/_version.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP", "W"]
ignore = [
    "ANN002",   # *args
    "ANN003",   # **kwargs
    "UP006",    # Type[T] -> type[T]
    "UP045",    # Optional[A] -> A | None
    "ANN401",   # _tx.Any
]
