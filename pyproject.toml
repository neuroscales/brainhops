[project]
name = "brainhops"
authors = [{name = "Balbastre, Yael", email = "y.balbastre@ucl.ac.uk"}]
description = "Scalable spatial transforms"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typing_extensions",
    "numpy",
    "scipy",
    "bagof-dispatchers >= 0.3.1",
    # The NumPy converter of bagof-converters 0.3 computes a Dask array,
    # copies a CuPy array to memory, and fits the array to the shape of
    # its hint with the rules of NumPy broadcasting, which the hints
    # `npvector` and `npmatrix` of `_core/typing.py` rely on. The
    # validators and factories of the same releases, which bagof-magic
    # uses, read the shapes of array hints in the same way.
    "bagof-hints ~= 0.1",
    "bagof-converters ~= 0.3",
    "bagof-validators ~= 0.2",
    "bagof-factories ~= 0.2",
    # 0.2 parameterises a polymorphic class (`Inverse[Affine]`), which the
    # typed inverses declare; 0.1 raises on it. 0.3 registers a subclass
    # with every polymorphic level above it and conjoins the constraints
    # it inherits, which the axes and coordinate systems rely on. 0.3.dev3
    # lets a subclass forget an inherited field (`Forget`) or take it over
    # under another name (`Inherit`).
    "bagof-magic ~= 0.3",
    # 0.3 gives a path the method `is_local`, makes `exists` return
    # False instead of raising when a name is too long to look up, and
    # leaves the query of a URL out of the name of a path. 0.3.1 refuses
    # an atomic write over a directory, cleans up after a failed one,
    # names the target in its errors, never treats an fsspec chain as
    # local, and compares paths whose files do not exist yet. 0.3.2
    # never removes the old directory when a staged directory cannot be
    # moved into place and the old one cannot be moved back.
    "bagof-paths ~= 0.3.2",
    # Units are parsed by pint, imported on first use. 0.21.1 is the last
    # release for Python 3.8; 0.24 is the first to support numpy 2.
    "pint >= 0.21; python_version < '3.9'",
    "pint >= 0.24; python_version >= '3.9'",
]
dynamic = ["version"]

[project.scripts]
brainhops = "brainhops.cli:main"

[project.optional-dependencies]

# backends
dask = ["dask[array]"]
cupy = ["cupy"]
backends = ["brainhops[dask]", "brainhops[cupy]"]

# io
h5py = ["h5py"]
itk = ["brainhops[h5py]"]
x5 = ["brainhops[h5py]"]
# BigDataViewer images are HDF5 files; their registrations are XML only.
bdv = ["brainhops[h5py]"]
# MATLAB v7.3 (HDF5) .mat matrices; text, .npy, .npz and v4-v7 .mat need
# only numpy and scipy.
matrix = ["brainhops[h5py]"]
nibabel = ["nibabel"]
pillow = ["pillow"]
tiff = ["tifffile"]
# openslide-python needs the OpenSlide C library, which openslide-bin
# ships as wheels (where it has none, install it with the system's
# package manager).
openslide = ["openslide-python", "openslide-bin"]
nifti = ["brainhops[nibabel]"]
mgh = ["brainhops[nibabel]"]
# MINC1 is read with nibabel; MINC2 (HDF5) also needs h5py.
minc = ["brainhops[nibabel]", "brainhops[h5py]"]
imaris = ["brainhops[h5py]"]
spm = ["brainhops[nifti]"]
fsl = ["brainhops[nifti]"]
niftyreg = ["brainhops[nifti]"]
# abczarr reads and writes Zarr through a driver; the default pulls in the
# zarr-python driver, and the other drivers are available on their own. The
# zarr-python driver needs zarr-python 3, which requires Python 3.11 or
# newer, so the zarr-python dependency is pinned to that on capable
# interpreters and the I/O is unavailable on older ones.
zarr = [
    # 0.2 for OME 0.6 support;
    # 0.2.1 opens and creates a store from any os.PathLike.
    # 0.2.3 checks that a 0.6 dataset only scales and translates.
    "abczarr >= 0.2.6",
    # abczarr reads and writes Zarr through a driver.
    # The zarr-py driver needs zarr-python 3, which requires python >= 3.11
    "zarr >= 3; python_version >= '3.11'",
    # On older interpreters, we fallback to tensorstore, which supports
    # zarr3 since 0.1.43, and has sets of versions compatible on the
    # range 3.8-3.10.
    "tensorstore >= 0.1.43 ; python_version <= '3.10'",
]
# N5 datasets are read with TensorStore, whose n5 driver decodes the raw,
# gzip, bzip2, xz and blosc compressions.
n5 = ["tensorstore >= 0.1.45"]
precomputed = ["tensorstore >= 0.1.45"]
zarr-python = ["abczarr[zarr-py] >= 0.2.6"]
zarr-tensorstore = ["abczarr[tensorstore] >= 0.2.6", "tensorstore >= 0.1.43"]
zarr-zarrista = ["abczarr[zarrista] >= 0.2.6"]
io = [
    "brainhops[h5py]",
    "brainhops[nibabel]",
    "brainhops[pillow]",
    "brainhops[tiff]",
    "brainhops[openslide]",
    "brainhops[n5]",
    "brainhops[precomputed]",
    "brainhops[zarr]",
]

# test
test = [
    "pytest",
    "pytest-cov",
    # Runs the tests in parallel (`pytest -n auto`).
    "pytest-xdist",
    "brainhops[dask]",
    "brainhops[h5py]",
    "brainhops[nibabel]",
    "brainhops[pillow]",
    "brainhops[tiff]",
    "brainhops[openslide]",
    "brainhops[n5]",
    "brainhops[precomputed]",
    "brainhops[zarr]",
    # Some tests open remote paths with universal_pathlib.
    "universal_pathlib",
]

# doc
doc = [
  "zensical>=0.0.11",
  "mkdocstrings[python]>=1.0.0",
  "markdown-grid-tables",
  "griffe-bagof-magic[dynamic]",
]


[project.urls]
Homepage = "https://github.com/neuroscales/brainhops"
Issues = "https://github.com/neuroscales/brainhops/issues"

[build-system]
requires = [
    "setuptools>=59",
    "wheel",
    "versioningit>=1.0",
]
build-backend = "setuptools.build_meta"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/brainhops/_version.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP", "W"]
ignore = [
    "ANN002",   # *args
    "ANN003",   # **kwargs
    "ANN401",   # Any
    "UP006",    # list[...] annotations need 3.9 at runtime
    "UP007",    # X | Y unions need 3.10
    "UP035",    # deprecated typing import (typing_extensions is intentional)
    "UP033",    # cache (instead of lru_cache(None)) needs 3.9
    "UP045",    # X | None optionals need 3.10
    "E741",     # Allow for the variable I | Ambiguous variable name
]
